[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantgate"
version = "0.1.0"
description = "CI gate for quantized GGUF models: KL drift, task accuracy, refusal behaviour and CPU speed per quant level."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Kumar" }]
requires-python = ">=3.11"
keywords = ["quantization", "gguf", "llama.cpp", "evaluation", "ci"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
    "numpy",
]

# Base install runs `quantgate demo` and `gate`. The extras add the real eval, the Hub
# access and the plots, which `quantgate eval`, `fetch` and `report` need.
[project.optional-dependencies]
llama = ["llama-cpp-python==0.3.37"]
data = ["datasets", "huggingface_hub"]
report = ["matplotlib"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "datasets",
    "huggingface_hub",
    "matplotlib",
]

[project.scripts]
quantgate = "quantgate.cli:app"

[project.urls]
Repository = "https://github.com/aayushkrm/quantgate"

[tool.hatch.build.targets.wheel]
packages = ["src/quantgate"]

# Defaults the installed package needs at run time. In a checkout these files are read in place
# (src/quantgate/resources.py); in a wheel they are bundled under quantgate/_data/.
[tool.hatch.build.targets.wheel.force-include]
"configs/gate.yaml" = "quantgate/_data/gate.yaml"
"configs/variants.yaml" = "quantgate/_data/variants.yaml"
"data/subsets" = "quantgate/_data/subsets"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs a local GGUF model and the llama extra; deselected in CI with -m 'not model'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["llama_cpp", "llama_cpp.*", "datasets", "datasets.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
