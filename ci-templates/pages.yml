name: pages

# Builds the static site from committed results/ and deploys it to GitHub Pages. With no committed
# results the check job sets has_results=false and the build and deploy jobs are skipped.

on:
  push:
    branches: [main]
    paths: ["results/**", "src/**", "configs/**", "Makefile"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_results: ${{ steps.check.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f results/report.json ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No committed results/report.json; skipping the site build."
          fi

  build:
    needs: check
    if: needs.check.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
